<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Rock Paper and Scissors</title>
        <style>
            .container h1 {
                display: flex;
                justify-content: space-between;
            }
        </style>
    </head>

    <body>
        <div class="container">
            <h1><span>Rock</span> <span>Paper</span> <span>Scissors</span></h1>
            <div class="computer">
                <h2>
                    Computer 🤖 <strong>Score <span>: 0</span></strong>
                </h2>
            </div>

            <div class="board-score">
                <p>Computer Picked rock and you picked scissors so you lose</p>
            </div>

            <div class="human">
                <h2>
                    Player 👱🏼 <strong>Score <span>: 0</span></strong>
                </h2>
            </div>
        </div>

        <script src="main.js"></script>
    </body>
</html>

<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Rock Paper and Scissors</title>
        <style>
            .container {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 0.5rem;
            }
            .container {
                flex-direction: column;
            }
            .container > * {
                flex: 1;
                height: 100px;
            }
            button {
                margin-top: 10px;
            }
        </style>
    </head>

    <body>
        <div class="container">
            <h1><span>Rock</span> <span>Paper</span> <span>Scissors</span></h1>
            <div class="computer">
                <h2>
                    Computer 🤖 <strong>Score <span>: 0</span></strong>
                </h2>
            </div>

            <div class="board-score">
                <p>Computer Picked rock and you picked scissors so you lose</p>
            </div>

            <div class="human">
                <span>To Play click one of the buttons: <br /></span>
                <button class="rock">Rock</button>

                <button class="paper">Paper</button>
                <button class="scissors">Scissors</button>
                <h2>
                    Player 👱🏼 <strong>Score <span>: 0</span></strong>
                </h2>
            </div>
        </div>

        <script src="main.js"></script>
    </body>
</html>

<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Rock Paper and Scissors</title>
        <style>
            body {
                text-align: center;
            }
            .container {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 0.5rem;
            }
            .container {
                flex-direction: column;
            }
            .container > * {
                flex: 1;
                height: 100px;
            }
            button {
                margin-top: 10px;
            }
            h1 {
                gap: 1 rem;
                display: flex;
                justify-content: space-around;
                align-items: center;
                width: 100%;
            }
            h1 span {
                /*flex: 1;*/
            }
        </style>
    </head>

    <body>
        <div class="container">
            <h1><span>Rock</span> <span>Paper</span> <span>Scissors</span></h1>
            <div class="computer">
                <h2>
                    Computer 🤖
                    <strong
                        >Score:
                        <span id="computer-score"> 0</span> Points</strong
                    >
                </h2>
            </div>

            <div class="board-score"></div>

            <div class="human">
                <span class="player-buttons"
                    >To Play click one of the buttons: <br />
                    <button class="rock">Rock</button>

                    <button class="paper">Paper</button>
                    <button class="scissors">Scissors</button></span
                >
                <h2>
                    Player 👱🏼
                    <strong
                        >Score: <span id="player-score"> 0</span> Points</strong
                    >
                </h2>
            </div>
            <div
                class="round-board"
                style="
                    display: flex;
                    flex-direction: column;
                    justify-content: center;
                    align-items: center;
                "
            >
                <h3 class="round">Round 1</h3>
                <h3>Game History 🎮</h3>
                <!--<h3>🤖 = rock, 👱🏼 = paper : paper beats rock : round 1</h3>-->
            </div>
        </div>

        <script src="main.js"></script>
    </body>
</html>
